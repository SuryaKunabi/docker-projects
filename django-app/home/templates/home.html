<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Django App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 500px;
            padding: 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5a4fcf;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: #5a4fcf;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .button:hover {
            background: #4338a8;
        }

        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Welcome to Django</h1>

        <p>
         single-page
            Django application.
        </p>

        <a href="#" class="button">Get Started</a>

        <div class="footer">
            Built with Python & Django
        </div>

    </div>

</body>
</html>
