<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
        }

        main {
            padding: 60px 20px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            background: #222;
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h2>My DevOps Project</h2>
    </header>

    <main>
        <h1>Hello, World! 🚀</h1>
        <p>This is a simple HTML webpage running inside a Docker container.</p>

        <button onclick="alert('Docker is working!')">
            Click Me
        </button>
    </main>

    <footer>
        <p>Created for Docker Practice</p>
    </footer>

</body>
</html>
